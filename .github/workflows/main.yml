name: Build UE4 Mobile Dumper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Build Project
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Extract DEX
        run: |
          mkdir -p output_dex
          find app/build/ -name "*.apk" -exec unzip -o {} "*.dex" -d output_dex/ \; || true
          find app/build/intermediates/ -name "*.dex" -exec cp {} output_dex/ \; || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UE4-Mobile-Dumper-Binaries
          path: |
            **/libs/arm64-v8a/
            output_dex/
