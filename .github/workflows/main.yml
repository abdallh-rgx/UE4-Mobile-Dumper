name: Build UE4 Mobile Dumper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build with NDK
        run: |
          MK_PATH=$(find . -name "Android.mk" -print -quit)
          JNI_DIR=$(dirname "$MK_PATH")
          cd "$JNI_DIR"
          ndk-build APP_PLATFORM=android-26 APP_ABI=arm64-v8a

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UE4-Mobile-Dumper-Binaries
          path: "**/libs/arm64-v8a/"
